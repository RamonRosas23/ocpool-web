name: ocpool

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ocpool
      POSTGRES_PASSWORD: ocpool_dev
      POSTGRES_DB: ocpool_dev
    ports:
      - "55432:5432"
    volumes:
      - ocpool-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ocpool -d ocpool_dev"]
      interval: 5s
      timeout: 5s
      retries: 12

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "11025:1025"
      - "18025:8025"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ocpool_minio
      MINIO_ROOT_PASSWORD: ocpool_minio_dev
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - ocpool-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  ocpool-postgres-data:
  ocpool-minio-data:
